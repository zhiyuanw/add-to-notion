<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add to Notion</title>
    <style>
      body {
        box-sizing: border-box;
        width: 360px;
        margin: 0;
        font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #app {
        padding: 20px;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 28px;
        line-height: 1.15;
      }

      p {
        margin: 0 0 14px;
      }

      button {
        width: 100%;
        min-height: 40px;
        margin: 4px 0 14px;
        font: inherit;
      }

      #popup-target-status,
      #popup-result-summary {
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <h1>Add to Notion</h1>
      <p>Save the current Confluence page to Notion.</p>
    </main>
    <script type="module" src="popup/index.js"></script>
  </body>
</html>
